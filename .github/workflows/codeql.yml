name: CodeQL

# Static analysis for JavaScript and TypeScript (DIG-103). Findings appear on the Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Read the code, write findings, and nothing else.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
