name: CI

# Pull requests cover feature branches; pushes to main cover merges. The weekly run only audits
# dependencies: new advisories appear without any code changing (DIG-103).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails on a high-severity advisory in what ships (DIG-103). Packages used only for development
  # are left out on purpose: they never run in production. It needs no install and no database, so
  # it reports fast and still reports when the build below fails.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  test:
    name: Build and test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zine
          POSTGRES_PASSWORD: zine
          POSTGRES_DB: digital_zine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Same values as .env.test, so the build bakes in the URL the e2e server uses.
    env:
      DATABASE_URL: postgresql://zine:zine@127.0.0.1:5432/digital_zine_test?schema=public
      AUTH_SECRET: test-digital-zine-secret-not-for-production-32chars
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3417
      LOCAL_STORAGE_DIR: .data/test-uploads
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache the installed tree, not just npm's download cache, so an unchanged lockfile skips
      # `npm ci` entirely. `npm run build` runs `prisma generate`, so the client is always fresh.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Reuse Next's compiler, ESLint, and TypeScript caches between runs. The key moves with the
      # source so each run saves a fresh cache; restore-keys falls back to the newest one.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tailwind.config.*', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build (type check and lint included)
        run: npm run build

      # Production applies prisma/migrations with `migrate deploy` (DIG-19). This fails when
      # schema.prisma changed without a migration, on a fresh database and on a db-push one.
      - name: Migrations match the schema
        run: npm run db:check-migrations

      - name: Unit, component, and API tests
        run: npm test

      # Tests run headless, so the headless shell is enough; it is a much smaller download.
      # No --with-deps: ubuntu-latest already has Chromium's libraries, and the flag only adds
      # optional CJK/Thai font packs from a mirror that can stall for minutes. If Chromium ever
      # fails to launch with a missing shared library, add --with-deps back.
      - name: Install Chromium for Playwright
        run: npx playwright install --only-shell chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
