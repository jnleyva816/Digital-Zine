# Weekly dependency updates (DIG-103). Security advisories open their own pull requests at once;
# this covers the steady stream of fixes so none of them pile up into a risky big jump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One pull request for the small stuff. A major version is always its own.
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Majors we have deferred (DIG-103, DIG-124): they cannot pass CI on Node 22, Next 15, and
    # Prisma 6. Security updates ignore this list. Drop an entry when its upgrade is planned.
    ignore:
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels: ["Security"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["Security"]
